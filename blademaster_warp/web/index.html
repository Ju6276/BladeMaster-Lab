<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BladeMaster · 在线切割</title>
<style>
:root{color-scheme:light;--ink:#27312d;--muted:#63716a;--line:#cfd7d1;--paper:#f2f5f1;--accent:#285940}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Avenir Next","PingFang SC",sans-serif}header{height:88px;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}h1{font-size:24px;font-weight:600;letter-spacing:-.8px;margin:0}h1 span{font-size:13px;color:var(--muted);font-weight:400;letter-spacing:.08em;margin-left:16px}.connection{font-size:13px;margin-top:6px;color:var(--muted)}button{border:1px solid var(--line);background:transparent;color:var(--ink);padding:10px 16px;font:inherit;font-size:13px;cursor:pointer}button:hover{background:#e0e8e1}button:focus-visible{outline:3px solid #a88638;outline-offset:3px}button.primary{background:var(--accent);color:#f0f4ee;border-color:var(--accent)}button:disabled{opacity:.45;cursor:wait}.controls{display:flex;gap:8px}.stage{position:relative;height:calc(100vh - 194px);min-height:220px;display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.view{position:relative;z-index:1;min-width:0;touch-action:none}.whole{grid-row:1/3;border-right:1px solid var(--line)}.detail{border-bottom:1px solid var(--line)}.view h2{font-size:12px;font-weight:500;letter-spacing:.08em;position:absolute;top:10px;left:20px;pointer-events:none}.view small{position:absolute;bottom:12px;left:20px;font-size:11px;color:var(--muted);pointer-events:none}.stats{height:68px;border-top:1px solid var(--line);display:flex;align-items:center;gap:36px;padding:12px 28px}.stats label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}.stats output{font-size:17px;font-variant-numeric:tabular-nums}.slow{color:#964c30}.good{color:var(--accent)}footer{padding:9px 28px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);display:flex;justify-content:space-between}.error{color:#a23b23!important}#result{font-size:13px;max-width:350px} @media(max-width:750px){header{padding:12px 16px;height:108px;align-items:flex-start;gap:12px}h1{font-size:20px}h1 span{display:block;margin:4px 0}.stage{height:calc(100vh - 240px);grid-template-columns:1fr 1fr;grid-template-rows:3fr 2fr}.whole{grid-row:1;grid-column:1/3;border-right:0;border-bottom:1px solid var(--line)}.detail{border-bottom:0;border-right:1px solid var(--line)}.stats{height:90px;padding:12px 16px;gap:16px;flex-wrap:wrap}.stats output{font-size:14px}footer{padding:8px 16px}footer span:last-child{display:none}.controls{gap:4px}button{padding:8px 10px}}
</style><script type="importmap">{"imports":{"three":"/vendor/three.module.min.js"}}</script></head>
<body><header><div><h1>BladeMaster <span>在线切割 / LIVE</span></h1><div id="connection" class="connection" role="status">正在连接仿真…</div></div><div class="controls"><button class="primary" id="start" disabled>开始</button><button id="pause" disabled>暂停</button><button id="stop" disabled>结束</button></div></header>
<main class="stage" id="stage"><canvas id="canvas"></canvas><section class="view whole" id="whole"><h2>FRANKA · 当前仿真状态</h2><small>拖动旋转 · 滚轮缩放</small></section><section class="view detail" id="detail"><h2>表面重建</h2></section><section class="view" id="particles"><h2>材料粒子</h2><small>颜色表示切割历史，不等于独立块数</small></section></main>
<section class="stats" aria-label="运行指标"><div><label>仿真时间</label><output id="sim">—</output></div><div><label>实际计算时间</label><output id="wall">—</output></div><div><label>实时倍率 · ≥ 1 才达实时</label><output id="ratio">—</output></div><div><label>材料反力</label><output id="force">—</output></div><div id="result" aria-live="polite"></div></section>
<footer><span id="storage">当前状态直接显示 · 不读取回放文件</span><span>GPU 材料 · CPU 机器人 · WebGL 显示</span></footer><script type="module" src="/app.js"></script></body></html>
